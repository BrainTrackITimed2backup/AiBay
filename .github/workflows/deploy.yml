name: Deploy AIBAY

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PLAYWRIGHT_BROWSERS_PATH: '0'

jobs:
  deploy-cf-pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Build for Cloudflare Pages
        env:
          NODE_ENV: production
          VITE_API_URL: https://aibay-3gql.onrender.com
          VITE_BASE_PATH: /
        run: npm run build

      - name: Deploy via Wrangler
        run: npx wrangler@3 pages deploy dist/public --project-name=aibay-main --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-render:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
              -H "Content-Type: application/json" \
              --fail --silent --show-error
            echo "Render deploy triggered successfully"
          else
            echo "RENDER_DEPLOY_HOOK_URL not configured — skipping Render deploy"
          fi

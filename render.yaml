services:
  - type: web
    name: aibay
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: node dist/index.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: EBAY_APP_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: VITE_ADMIN_PASSWORD
        sync: false
      - key: NEON_DATABASE_URL
        sync: false

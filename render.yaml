services:
  - type: web
    name: aibay
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: node dist/index.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aibay-db
          property: connectionString
      - key: EBAY_APP_ID
        sync: false

databases:
  - name: aibay-db
    plan: free
    databaseName: aibay
    user: aibay
